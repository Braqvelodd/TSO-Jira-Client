# Configuration for the JIRA API Client
config_version = 1.5

# LLM Configuration
# llama_cli_path = C:\\llm\\llama-cli.exe
# llama_model_path = C:\\llm\\models\\llama-3-8b-instruct.Q4_K_M.gguf
llm_timeout_minutes = 5

# API Configuration
api_timeout_seconds = 30
autocomplete.enabled = true
jql.max_results = 500

# UI Configuration (Comment out to disable a tab)
# Raw API Call and JQL Runner are always enabled.
tab.Reports.enabled = true
tab.TaskBuilder.enabled = true
tab.TemplateBuilder.enabled = true
tab.Reconciliation.enabled = true
tab.BulkActions.enabled = true
tab.WorkflowAutomation.enabled = true
tab.WorkflowOrchestrator.enabled = true
tab.CommentSummarizer.enabled = true
# tab.IssueViewer.enabled = true

# Number of parallel threads for bulk actions and task building
parallel_threads = 5

# Task Builder Keyboard Shortcuts (Examples: Ctrl + Slash, Ctrl + D, Alt + Down)
keybind.taskbuilder.duplicate.down = Ctrl + Alt + Down
keybind.taskbuilder.duplicate.up = Ctrl + Alt + Up
keybind.taskbuilder.move.down = Alt + Down
keybind.taskbuilder.move.up = Alt + Up
keybind.taskbuilder.comment = Ctrl + /
keybind.taskbuilder.delete = Ctrl + D
keybind.taskbuilder.bold = Ctrl + B
keybind.taskbuilder.italic = Ctrl + I

