# defaults.properties - Default Display Queries, Project Keys, and Field Mappings

# Default Display in JQL Runner
defaults.jql_default_query = issuetype = Bug AND status = 'To Do' ORDER BY created DESC
defaults.jql_display_fields = key, summary, status, assignee, issuelinks
jql.max_results = 500

# Task & Clone Defaults
defaults.clone_project_key = TFS
defaults.subtask_types = Sub-task,ST-PCU,ST-Database,ST-Interface
parallel_threads = 5

# Reconciliation Defaults
defaults.reconciliation_parent_keys = TFS-49439,TFS-35035

# Workflow Automation Defaults
workflow_jql = project in (JRS, MOD, MSMB, RFFKCI, TSO) AND status in ("Incoming Requirements", "Submitted to TSO")
workflow_fy_summary_issue = TFS-59109

# CI Types Prefixes
ci_types.prefixes = COB,PROC,JCL,SYS,ASM,COPY,DMGR,DCLG,CMAP

# Custom Field ID Mappings
custom_fields.epic_link = customfield_13056
custom_fields.source_issue_key = customfield_10400
custom_fields.maintenance_type = customfield_10522
custom_fields.design_phase = customfield_10523
custom_fields.analysis_phase = customfield_10512
custom_fields.team_id = customfield_15350
custom_fields.reporter_name = customfield_10540
custom_fields.due_date = customfield_10517
custom_fields.reset_field = customfield_10519
