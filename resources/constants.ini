# constants.ini - Core USMC TSO Jira Client Configuration Settings
# Users can modify these values to change CI types, JIRA custom field IDs, and default project keys.

constants_version = 1.5

[Environment]
# The base URL for the JIRA instance.
jira_base_url = https://tso-jira.mcw.usmc.mil

# Workflow Automation settings
workflow_jql = project in (JRS, MOD, MSMB, RFFKCI, TSO) AND status in ("Incoming Requirements", "Submitted to TSO")
workflow_fy_summary_issue = TFS-59109

[Reconciliation]
# Reconciliation Settings (ISPW Report Columns - Start,End)
recon.ispw.ci_type.bounds = 0,4
recon.ispw.ci_name.bounds = 5,13
recon.ispw.sr.bounds = 30,40
recon.ispw.user.bounds = 41,47
recon.ispw.action.bounds = 55,65
recon.ispw.min_line_length = 65

[CI_Types]
# Comma-separated list of CI types/prefixes to match against sub-task summaries
prefixes = COB,PROC,JCL,SYS,ASM,COPY,DMGR,DCLG,CMAP

[Custom_Fields]
# Custom field IDs used across the application
epic_link = customfield_13056
source_issue_key = customfield_10400
maintenance_type = customfield_10522
design_phase = customfield_10523
analysis_phase = customfield_10512
team_id = customfield_15350
reporter_name = customfield_10540
due_date = customfield_10517
reset_field = customfield_10519

[Defaults]
# Default target project key for cloning operations
clone_project_key = TFS

# Comma-separated list of sub-task issue types for the Task Builder
subtask_types = Sub-task,ST-PCU,ST-Database,ST-Interface

# Default displaying fields in the JQL runner
jql_display_fields = key, summary, status, assignee, issuelinks

# Default JQL query in the JQL runner
jql_default_query = issuetype = Bug AND status = 'To Do' ORDER BY created DESC

# Default Jira Parent Keys in the reconciliation panel (comma-separated)
reconciliation_parent_keys = TFS-49439,TFS-35035


[Teams]
# Team Mappings
# Individual fields can be referenced as team.KEY.name, team.KEY.lead, team.KEY.component, team.KEY.id
team.unassigned.name = Unassigned backlog
team.unassigned.lead = LINCOLN.TODD.ALAN

team.lifeline.name = Team Lifeline
team.lifeline.lead = HULL.JAMES.DOUGLAS
team.lifeline.component = Team Lifeline
team.lifeline.id = 157

team.decisive.name = Team Decisive
team.decisive.lead = ABERNATHY.DAMON.LAMAR
team.decisive.component = Team Decisive
team.decisive.id = 147

team.renegades.name = Team Renegades
team.renegades.lead = CROSSETT.OLIVIA
team.renegades.component = Team Renegades
team.renegades.id = 156

team.fulcrum.name = Team Fulcrum
team.fulcrum.lead = ANDERSON.CHAD.D
team.fulcrum.component = Team Fulcrum
team.fulcrum.id = 143

team.fidelis.name = Team Fidelis
team.fidelis.lead = JOHNSON.TONY.E
team.fidelis.component = Team Fidelis
team.fidelis.id = 149
